name: deploy-slides-pages

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'slide/**'
      - '.github/workflows/deploy-slides-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: slide/package-lock.json

      - name: Install slide dependencies
        run: npm ci --prefix slide

      - name: Build English and Korean decks
        env:
          SLIDEV_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:pages --prefix slide

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: slide/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
